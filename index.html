<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MAKC Mini App</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f0f;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    .header {
      width: 100%;
      max-width: 480px;
      text-align: center;
      padding: 30px 0 20px;
    }
    .header h1 {
      font-size: 24px;
      font-weight: 700;
      color: #4fc3f7;
    }
    .header p {
      font-size: 14px;
      color: #aaaaaa;
      margin-top: 6px;
    }
    .card {
      background: #1e1e1e;
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 480px;
      margin-bottom: 16px;
    }
    .card h2 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 10px;
      color: #4fc3f7;
    }
    .card p {
      font-size: 14px;
      color: #cccccc;
      line-height: 1.6;
    }
    .btn {
      display: block;
      width: 100%;
      max-width: 480px;
      background: #4fc3f7;
      color: #000000;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 10px;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.85; }
    .footer {
      margin-top: auto;
      padding: 20px 0;
      font-size: 12px;
      color: #555555;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>MAKC Mini App</h1>
    <p>Базовое мини-приложение для бота</p>
  </div>

  <div class="card">
    <h2>Добро пожаловать!</h2>
    <p>Это базовая версия Mini App. Здесь будет развиваться функционал бота в МАКСе.</p>
  </div>

  <button class="btn" id="btnMain" onclick="onMainAction()">Главное действие</button>
  <button class="btn" id="btnInfo" onclick="onInfo()" style="background:#2a2a2a;color:#ffffff;">Информация</button>

  <div class="footer">© 2026 MAKC Bot — v1.0.0</div>

  <script>
    // Инициализация SDK МАКС (если доступен)
    if (window.MaxApp) {
      MaxApp.ready();
    }

    function onMainAction() {
      alert('Главное действие — здесь будет ваш основной функционал');
    }

    function onInfo() {
      alert('Версия: 1.0.0\nРепозиторий: github.com/skylinegtr030-web/max-bot-miniapp');
    }
  </script>
</body>
</html>
