<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MAKC Mini App</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f0f;
      color: #fff;
      min-height: 100vh;
      padding: 20px;
    }
    .wrap { max-width: 520px; margin: 0 auto; }
    .header { text-align: center; padding: 24px 0 18px; }
    .header h1 { font-size: 26px; color: #4fc3f7; margin-bottom: 8px; }
    .header p { font-size: 14px; color: #aaa; }
    .card {
      background: #1d1d1d;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 16px;
      border: 1px solid #2b2b2b;
    }
    .card h2 { font-size: 17px; margin-bottom: 14px; color: #4fc3f7; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 14px; margin-bottom: 8px; color: #d7d7d7; }
    .input, .textarea {
      width: 100%;
      background: #111;
      color: #fff;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 13px 14px;
      font-size: 15px;
      outline: none;
    }
    .textarea { min-height: 80px; resize: vertical; }
    .chips { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .chip {
      border: 1px solid #333;
      border-radius: 12px;
      padding: 12px;
      background: #111;
      cursor: pointer;
      text-align: center;
      transition: .2s;
      font-size: 14px;
      color: #fff;
    }
    .chip.active { background: #4fc3f7; color: #000; border-color: #4fc3f7; font-weight: 600; }
    .btn {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 14px;
      background: #4fc3f7;
      color: #000;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 6px;
    }
    .btn:disabled { opacity: .6; cursor: not-allowed; }
    .status { margin-top: 12px; font-size: 14px; color: #9adfff; min-height: 20px; text-align: center; }
    .success-screen {
      display: none;
      text-align: center;
      padding: 40px 20px;
    }
    .success-screen .icon { font-size: 64px; margin-bottom: 16px; }
    .success-screen h2 { font-size: 22px; color: #4fc3f7; margin-bottom: 10px; }
    .success-screen p { color: #aaa; font-size: 15px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <h1>&#x1F4CB; MAKC Bot</h1>
      <p>&#x412;&#x44B;&#x431;&#x435;&#x440;&#x438;&#x442;&#x435;, &#x447;&#x442;&#x43E; &#x432;&#x430;&#x43C; &#x43D;&#x443;&#x436;&#x43D;&#x43E;, &#x438; &#x43C;&#x44B; &#x441;&#x432;&#x44F;&#x436;&#x435;&#x43C;&#x441;&#x44F; &#x441; &#x432;&#x430;&#x43C;&#x438;</p>
    </div>

    <div id="formBlock">
      <div class="card">
        <h2>&#x414;&#x430;&#x43D;&#x43D;&#x44B;&#x435; &#x43A;&#x43B;&#x438;&#x435;&#x43D;&#x442;&#x430;</h2>
        <div class="field">
          <label for="name">&#x418;&#x43C;&#x44F;</label>
          <input id="name" class="input" type="text" placeholder="&#x412;&#x432;&#x435;&#x434;&#x438;&#x442;&#x435; &#x438;&#x43C;&#x44F;" />
        </div>
        <div class="field">
          <label for="phone">&#x422;&#x435;&#x43B;&#x435;&#x444;&#x43E;&#x43D;</label>
          <input id="phone" class="input" type="tel" placeholder="+7 ..." />
        </div>
      </div>

      <div class="card">
        <h2>&#x427;&#x442;&#x43E; &#x432;&#x430;&#x43C; &#x43D;&#x443;&#x436;&#x43D;&#x43E;?</h2>
        <div class="chips" id="chips">
          <button type="button" class="chip" data-value="Konsultatsiya">&#x1F4AC; &#x41A;&#x43E;&#x43D;&#x441;&#x443;&#x43B;&#x44C;&#x442;&#x430;&#x446;&#x438;&#x44F;</button>
          <button type="button" class="chip" data-value="Zakaz">&#x1F6D2; &#x417;&#x430;&#x43A;&#x430;&#x437;</button>
          <button type="button" class="chip" data-value="Podderzhka">&#x1F6E0; &#x41F;&#x43E;&#x434;&#x434;&#x435;&#x440;&#x436;&#x43A;&#x430;</button>
          <button type="button" class="chip" data-value="Drugoe">&#x2753; &#x414;&#x440;&#x443;&#x433;&#x43E;&#x435;</button>
        </div>
      </div>

      <div class="card">
        <h2>&#x41A;&#x43E;&#x43C;&#x43C;&#x435;&#x43D;&#x442;&#x430;&#x440;&#x438;&#x439;</h2>
        <div class="field">
          <textarea id="comment" class="textarea" placeholder="&#x41E;&#x43F;&#x438;&#x448;&#x438;&#x442;&#x435;, &#x447;&#x442;&#x43E; &#x43D;&#x443;&#x436;&#x43D;&#x43E; (&#x43D;&#x435;&#x43E;&#x431;&#x44F;&#x437;&#x430;&#x442;&#x435;&#x43B;&#x44C;&#x43D;&#x43E;)"></textarea>
        </div>
        <button id="submitBtn" class="btn">&#x1F4E8; &#x41E;&#x442;&#x43F;&#x440;&#x430;&#x432;&#x438;&#x442;&#x44C; &#x437;&#x430;&#x44F;&#x432;&#x43A;&#x443;</button>
        <div class="status" id="status"></div>
      </div>
    </div>

    <div class="success-screen" id="successScreen">
      <div class="icon">&#x2705;</div>
      <h2>&#x417;&#x430;&#x44F;&#x432;&#x43A;&#x430; &#x43E;&#x442;&#x43F;&#x440;&#x430;&#x432;&#x43B;&#x435;&#x43D;&#x430;!</h2>
      <p>&#x41C;&#x44B; &#x441;&#x432;&#x44F;&#x436;&#x435;&#x43C;&#x441;&#x44F; &#x441; &#x432;&#x430;&#x43C;&#x438; &#x432; &#x431;&#x43B;&#x438;&#x436;&#x430;&#x439;&#x448;&#x435;&#x435; &#x432;&#x440;&#x435;&#x43C;&#x44F;</p>
    </div>
  </div>

  <script>
    if (window.MaxApp) { MaxApp.ready(); }

    let selectedService = '';

    document.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', () => {
        document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        selectedService = chip.dataset.value;
      });
    });

    document.getElementById('submitBtn').addEventListener('click', async () => {
      const status = document.getElementById('status');
      const submitBtn = document.getElementById('submitBtn');
      const name = document.getElementById('name').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const comment = document.getElementById('comment').value.trim();

      if (!name || !phone || !selectedService) {
        status.textContent = 'Заполните имя, телефон и выберите услугу.';
        return;
      }

      submitBtn.disabled = true;
      status.textContent = 'Отправляем...';

      const payload = { name, phone, service: selectedService, comment };

      try {
        const resp = await fetch('/submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const result = await resp.json();
        if (result.ok) {
          document.getElementById('formBlock').style.display = 'none';
          document.getElementById('successScreen').style.display = 'block';
        } else {
          status.textContent = 'Ошибка: ' + (result.error || 'попробуйте ещё раз');
          submitBtn.disabled = false;
        }
      } catch (e) {
        status.textContent = 'Нет связи с сервером. Попробуйте позже.';
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
